name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-language: node
          node-version: 18
          cache-dependency-path: woodcraftpro-frontend/package-lock.json

      - name: Install & Build
        run: |
          cd woodcraftpro-frontend
          npm ci || npm install
          npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./woodcraftpro-frontend/dist

# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=woodcraftpro-backend

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/woodcraftpro_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=9a2f8c4e7b1d3a5f8e6c4b2a0f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1
app.jwt.expiration-ms=86400000
